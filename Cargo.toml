[workspace]
resolver = "2"
members = [
    "crates/rosbridge-protocol",
    "crates/ros-message",
    "crates/rosbridge-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/dominikn2/test"
authors = ["rosbridge-rs contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_bytes = "0.11"
ciborium = "0.2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
base64 = "0.22"
bytes = "1"
async-trait = "0.1"
png = "0.17"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"
dashmap = "6"
half = "2"

# pure-rust ROS2 / DDS backend (no ROS install required)
ros2-client = "0.7"
rustdds = "0.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
