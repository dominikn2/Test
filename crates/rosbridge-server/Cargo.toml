[package]
name = "rosbridge-server"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "rosbridge_websocket"

[features]
default = []
# Real ROS2/DDS backend via the pure-Rust ros2-client + rustdds stack.
dds = ["dep:ros2-client", "dep:rustdds", "dep:futures"]
# WSS / TLS termination (certfile + keyfile) via rustls.
tls = ["dep:tokio-rustls", "dep:rustls-pemfile"]

[[bin]]
name = "rosbridge_websocket"
path = "src/main.rs"

[dependencies]
rosbridge-protocol = { path = "../rosbridge-protocol" }
ros-message = { path = "../ros-message" }
serde.workspace = true
serde_json.workspace = true
ciborium.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
base64.workspace = true
bytes.workspace = true
async-trait.workspace = true
png.workspace = true
clap.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
ros2-client = { workspace = true, optional = true }
rustdds = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }

[dev-dependencies]
serde_json.workspace = true
rcgen = "0.13"
tempfile = "3"
